name: Compilar IPSICOL_Asistencia

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r IPSICOL_Asistencia/requirements.txt
        pip install -r IPSICOL_Asistencia/requirements-build.txt

    - name: Compilar con PyInstaller usando el archivo .spec
      run: |
        cd IPSICOL_Asistencia
        pyinstaller IPSICOL_Asistencia.spec

    - name: Subir ejecutable como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: IPSICOL_Asistencia-Windows
        path: IPSICOL_Asistencia/dist/
